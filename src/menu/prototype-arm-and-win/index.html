<!doctype html>
<!--
  PROTOTIPO DESCARTABLE — no es parte del juego (Wollok no lo usa). Borrar cuando se decida.

  1. BRAZO Y COLOCAR (?screen=arm): A ESCALA REAL del juego y respetando lo que puede Wollok:
     - todo va alineado a celdas de 50 px (Wollok avisa el clic por celda: cada botón ocupa celdas enteras);
     - nada depende de pasar el mouse por encima;
     - cada pieza es una imagen fija (las generaría un script, como makeBoardUi.py).
     BRAZO INTELIGENTE (elegido: la grilla): arriba, el brazo y de dónde agarra (como en el tablero); abajo, una
     celda por ingrediente, de a 4 por fila (entran 32). Cada clic lo manda al lado siguiente (nada → ↑ → → → ↓ →
     nada, sin el lado de donde agarra) y una flechita en la esquina dice hacia dónde sale. Siempre igual, haya
     2 o 28 ingredientes. Mientras se edita, el tablero muestra qué sale por cada lado.
     BRAZO COMÚN: "DEJA TODO HACIA" y una fila con las cuatro flechas; la de donde agarra, en rojo y sin clic.
     COLOCAR: la brújula de 4x4 celdas reemplaza a la fila de teclas ← ↑ ↓ → de "HACIA DÓNDE MIRA".
     "Ver celdas" (barra de abajo) dibuja la grilla de Wollok, para ver que cada botón cae en celdas enteras.

  2. NIVEL COMPLETO (?screen=win): la comanda (variante elegida).

  Cómo abrirlo: servidor "prototipo-tutorial" de .claude/launch.json, y
  http://localhost:8765/src/menu/prototype-arm-and-win/index.html
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo: brazo, colocar y nivel completo</title>
<style>
  :root { --cream: #fdf3e1; --brown: #5a3a1e; --brown-dark: #3b2412; --panel: rgb(3,133,185); --yellow: #ffd23f;
          --edit: #e8a317; --place: #3fa34d; --red: #c8402f; --font: "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10202a; color: #fff; font-family: var(--font); overflow: hidden; }
  #viewport { position: fixed; inset: 0 0 64px 0; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1100px; height: 650px; transform-origin: center; overflow: hidden; background: var(--panel); user-select: none; }
  .abs { position: absolute; }
  .mask { position: absolute; background: var(--panel); }
  .chip { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; background: #2c3e48; color: #fff; font: 800 10px var(--font); box-shadow: 0 2px 0 #11191e; }
  .grid { position: absolute; inset: 0; pointer-events: none; z-index: 40;
          background-image: linear-gradient(#ff00ff70 1px, transparent 1px), linear-gradient(90deg, #ff00ff70 1px, transparent 1px); background-size: 50px 50px; }
  .txt { position: absolute; width: 200px; text-align: center; font: 800 12px var(--font); letter-spacing: .6px; color: var(--yellow); }
  .txt.white { color: #fff; font-weight: 700; letter-spacing: 0; }

  /* ---------- las piezas de la brújula (cada una sería una imagen fija) ---------- */
  .tile { position: absolute; border-radius: 10px; background: var(--cream); border: 3px solid var(--brown); box-shadow: inset 0 -4px 0 #e6d6bb;
          display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
  .tile .arr { font: 900 24px/1 var(--font); color: var(--brown); }
  .tile.sel { background: var(--yellow); border-color: var(--brown-dark); box-shadow: inset 0 -4px 0 #d8ad1c, 0 0 0 3px #fff; }
  .tile.in { background: var(--red); border-color: #7a1d12; box-shadow: inset 0 -4px 0 #9b2e20; cursor: default; flex-direction: column; gap: 0; }
  .tile.in .arr { color: #fff; font-size: 20px; }
  .tile.in .lbl { font: 900 10px var(--font); color: #fff; letter-spacing: .5px; }
  .tile .key { position: absolute; right: 3px; bottom: 3px; }
  .tile.vert { flex-direction: column; }
  .tile .badge { width: 30px; height: 30px; }
  .tile .none { font: 800 10px var(--font); color: #9b8668; }
  .center { position: absolute; width: 100px; height: 100px; border-radius: 12px; background: #ffffff26; border: 2px dashed #ffffff60; overflow: hidden; display: grid; place-items: center; }
  .center img.big { position: absolute; width: 200px; height: 200px; left: -52px; top: -52px; }
  .center img.menu { width: 100px; height: 100px; }

  .tile img.ing { width: 46px; height: 46px; }
  .preview { display: flex; align-items: center; gap: 1px; padding: 1px 4px; border-radius: 8px; background: #fffdf6; border: 2px solid var(--brown); font: 900 14px var(--font); color: var(--brown); box-shadow: 0 2px 0 #0006; z-index: 5; }
  /* filas de ingredientes: una fila de 4 celdas cada una */
  .irow { position: absolute; left: 902px; width: 196px; height: 46px; border-radius: 9px; background: #ffffff1f; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 2px; cursor: pointer; }
  .irow img { width: 46px; height: 46px; }
  .irow .n { font: 700 13px var(--font); }
  .irow .n small { font-size: 11px; opacity: .75; }
  .irow .box { margin-left: auto; width: 30px; height: 30px; border-radius: 7px; border: 3px solid #ffffff90; display: grid; place-items: center; font: 900 18px var(--font); flex: none; }
  .irow.on { background: var(--cream); color: var(--brown-dark); }
  .irow.on .box { background: var(--place); border-color: #22682c; color: #fff; }

  /* menú de colocar */
  .slotimg { position: absolute; width: 100px; height: 100px; cursor: pointer; }
  .slotsel { position: absolute; width: 100px; height: 100px; pointer-events: none; }

  /* ---------- comanda ---------- */
  .dim { position: absolute; inset: 0; background: #0a1820b0; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; padding: 9px 14px; font: 800 14px var(--font); color: #fff; background: var(--place); box-shadow: 0 4px 0 #22682c; cursor: pointer; }
  .btn.alt { background: #8d7357; box-shadow: 0 4px 0 #5a4630; }
  .btn.blue { background: #2f80c8; box-shadow: 0 4px 0 #1d4f7d; }
  .btn .chip { background: #0004; box-shadow: none; }
  .btnrow { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .ticket { position: absolute; left: 360px; top: 60px; width: 380px; background: #fffdf6; color: #333; padding: 24px 28px 30px; box-shadow: 0 10px 30px #000a; transform: rotate(-1.5deg); font-family: "Courier New", monospace; }
  .ticket::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px; background: linear-gradient(135deg, #fffdf6 50%, transparent 50%) 0 0/14px 14px, linear-gradient(225deg, #fffdf6 50%, transparent 50%) 0 0/14px 14px; }
  .ticket h3 { margin: 0; text-align: center; font-size: 22px; letter-spacing: 2px; }
  .ticket .meta { text-align: center; font-size: 13px; color: #666; margin: 4px 0 12px; }
  .ticket .line { display: flex; justify-content: space-between; font-size: 16px; padding: 6px 0; border-bottom: 1px dashed #bbb; align-items: center; }
  .ticket .line img { width: 30px; height: 30px; vertical-align: middle; margin-right: 6px; }
  .ticket .total { font-weight: 900; font-size: 18px; border-bottom: 0; margin-top: 4px; }
  .stamp { position: absolute; right: -22px; top: 6px; transform: rotate(-14deg); border: 4px solid #c0392b; color: #c0392b; font: 900 26px var(--font); padding: 4px 12px; border-radius: 8px; opacity: .85; letter-spacing: 2px; }
  .ticket .btnrow { font-family: var(--font); }
  .chef { position: absolute; }

  /* ---------- barra del prototipo ---------- */
  #switcher { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: #111; border-radius: 999px; padding: 6px 8px; font: 600 12px system-ui; box-shadow: 0 6px 24px #000a; white-space: nowrap; max-width: calc(100vw - 16px); overflow-x: auto; z-index: 100; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; padding: 6px 10px; font: 700 12px system-ui; cursor: pointer; }
  #switcher button.on { background: #ffd23f; color: #3b2412; }
  #switcher .tag { background: #ff5252; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 800; }
  #switcher .sep { width: 1px; height: 20px; background: #444; }
  #switcher .state { color: #9fe39f; font: 11px ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="switcher"></div>
<script>
const A = "../../../assets/";
const stage = document.getElementById("stage");
function fit() { const vp = document.getElementById("viewport"); const s = Math.min(vp.clientWidth / 1100, vp.clientHeight / 650); stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();
const params = new URLSearchParams(location.search);
const SCREEN = params.get("screen") === "win" ? "win" : "arm";

// Coordenadas de Wollok: algo de w x h celdas con su esquina de abajo a la izquierda en (x, y)
const L = (x) => x * 50;
const T = (y, h = 1) => (13 - y - h) * 50;
const box = (x, y, w, h, pad = 2) => `left:${L(x) + pad}px;top:${T(y, h) + pad}px;width:${w * 50 - 2 * pad}px;height:${h * 50 - 2 * pad}px`;

// ---------------- estado ----------------
const DIRS = ["up", "right", "down", "left"];
const ARROW = { up: "↑", right: "→", down: "↓", left: "←" };
const NAME = { up: "ARRIBA", right: "DERECHA", down: "ABAJO", left: "IZQUIERDA" };
const KEY = { up: "W", left: "A", down: "S", right: "D" };
const next = (d) => DIRS[(DIRS.indexOf(d) + 1) % 4];
const invert = (d) => next(next(d));
const KINDS = [
  ["friedPotato", "Papa frita", "food/Ingredients/potatoes/potato_cooked.png"],
  ["burntPotato", "Papa quemada", "food/Ingredients/potatoes/potato_burnt.png"],
  ["eggFryed", "Huevo frito", "food/Ingredients/eggs/egg_fryed.png"],
  ["cookedMeat", "Carne cocida", "food/Ingredients/meats/meat_cooked.png"],
  ["sausageCooked", "Salchicha", "food/Ingredients/sausages/sausage_cooked.png"],
];
// Todos los ingredientes del juego (28): para ver cómo escala si el brazo pudiera filtrar muchos
const MANY = ["Ham/ham_cutted", "Ham/ham_raw", "bacons/bacon_cooked", "bacons/bacon_raw", "buns/bun_cooked", "buns/bun_cut", "buns/bun_whole",
  "cheeses/cheese_cutted", "cheeses/cheese_feta", "cheeses/cheese_raw", "eggs/egg_fryed", "eggs/egg_raw", "lettuces/lettuce_cut", "lettuces/lettuce_whole",
  "meats/meat_cooked", "meats/meat_raw", "pizza-doughs/pizza-dough_cooked", "pizza-doughs/pizza-dough_raw", "potatoes/potato_burnt", "potatoes/potato_cooked",
  "potatoes/potato_cut", "potatoes/potato_raw", "salamis/salami_cutted", "salamis/salami_raw", "sausages/sausage_cooked", "sausages/sausage_raw",
  "tomatoes/tomato_cut", "tomatoes/tomato_whole"].map(f => [f, f.split("/")[1].replace("_", " "), `food/Ingredients/${f}.png`]);
const manyRoutes = {};
const badge = (img) => `${A}machines/Dispenser/badge/${img}`;
const S = {
  panel: params.get("panel") || "smart",     // smart | auto | place
  grid: params.get("grid") === "1",
  many: params.get("many") === "1",          // brazo inteligente con muchos ingredientes (grilla)
  input: "left",                             // de dónde agarra el brazo (tutorial: la freidora, a su izquierda)
  routes: { friedPotato: "right", burntPotato: null, eggFryed: null, cookedMeat: null, sausageCooked: null },
  output: "right",                           // brazo común: por dónde deja todo
  selected: "right",                         // lado elegido en la brújula del brazo inteligente
  placeDir: "right",                         // colocar: hacia dónde mira la próxima máquina
  machine: 0,                                // colocar: máquina elegida en el menú
};
const outputs = () => DIRS.filter(d => d !== S.input);
const itemsFor = (side) => KINDS.filter(([k]) => S.routes[k] === side);
function rotateArm() {
  S.input = next(S.input);
  for (const k in S.routes) if (S.routes[k]) S.routes[k] = next(S.routes[k]);
  for (const k in manyRoutes) if (manyRoutes[k]) manyRoutes[k] = next(manyRoutes[k]);
  S.output = next(S.output); S.selected = next(S.selected);
}

// ---------------- barra del prototipo ----------------
function bar() {
  const b = document.getElementById("switcher");
  const btn = (label, on, fn) => `<button class="${on ? "on" : ""}" data-fn="${fn}">${label}</button>`;
  b.innerHTML = `<span class="tag">PROTOTIPO</span>` +
    btn("Brazo y colocar", SCREEN === "arm", "sArm") + btn("Nivel completo (comanda)", SCREEN === "win", "sWin") +
    (SCREEN === "arm" ? `<span class="sep"></span>` +
      btn("Editando brazo inteligente", S.panel === "smart", "pSmart") + btn("Editando brazo común", S.panel === "auto", "pAuto") +
      btn(S.many ? "Ingredientes: los 28 del juego" : "Ingredientes: los 5 de hoy", S.many, "many") + btn("Colocando", S.panel === "place", "pPlace") + btn("⟳ Girar el brazo", false, "rot") + btn("Ver celdas", S.grid, "grid")
      : btn("último nivel", params.get("last") === "1", "last")) +
    `<span class="state" id="state"></span>`;
  const fns = {
    sArm: () => { location.search = "screen=arm"; }, sWin: () => { location.search = "screen=win"; },
    pSmart: () => { S.panel = "smart"; }, pAuto: () => { S.panel = "auto"; }, pPlace: () => { S.panel = "place"; },
    rot: rotateArm, grid: () => { S.grid = !S.grid; }, many: () => { S.many = !S.many; if (S.many) S.panel = "smart"; },
    last: () => { const p = new URLSearchParams(location.search); if (p.get("last") === "1") p.delete("last"); else p.set("last", "1"); location.search = p; },
  };
  b.querySelectorAll("button").forEach(x => x.onclick = () => { fns[x.dataset.fn](); render(); });
}

// ---------------- escena (el tutorial 1, como en el juego) ----------------
function scene() {
  stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${A}background.gif" style="left:0;top:0">`);
  stage.insertAdjacentHTML("beforeend", `<div class="mask" style="left:0;top:66px;width:200px;height:584px"></div><div class="mask" style="left:900px;top:0;width:200px;height:650px"></div>`);
  const put = (src, x, y, size = 50, off = 0) => stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${A}${src}" style="left:${L(x) + off}px;top:${T(y) + off}px;width:${size}px;height:${size}px">`);
  put("machines/Dispenser/right_game.png", 5, 5); put("machines/Belt/right_game.png", 6, 5); put("machines/CuttingMachine/right_game.png", 7, 5);
  put("machines/Belt/right_game.png", 8, 5); put("machines/AutomaticArm/left_game.png", 9, 5, 150, -50); put("machines/Fryer/right_game.png", 10, 5);
  put(`machines/${S.panel === "auto" ? "AutomaticArm" : "SmartRoboticArm"}/${S.input}_game.png`, 11, 5, 150, -50);
  put("machines/Belt/right_game.png", 12, 5); put("machines/Belt/up_curve_left_game.png", 13, 5);
  for (let y = 6; y <= 10; y++) put("machines/Belt/up_game.png", 13, y);
  stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${badge("food/Ingredients/potatoes/potato_raw.png")}" style="left:${L(4.9)}px;top:${T(5) - 10}px">`);
  stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${A}menu/side_buttons.png" style="left:0;top:450px">`);
}

// ---------------- la brújula (4x4 celdas, x 18 a 21, desde la fila y0) ----------------
// sides: para cada dirección, { cls, html, onclick }; centerHtml: lo que va en el centro (2x2)
function compass(y0, sides, centerHtml) {
  const places = {
    up: [19, y0 + 3, 2, 1], down: [19, y0, 2, 1],
    left: [18, y0 + 1, 1, 2], right: [21, y0 + 1, 1, 2],
  };
  DIRS.forEach(d => {
    const [x, y, w, h] = places[d];
    const s = sides[d];
    const el = document.createElement("div");
    el.className = `tile ${h === 2 ? "vert" : ""} ${s.cls || ""}`;
    el.style.cssText = box(x, y, w, h, 3);
    el.innerHTML = s.html;
    if (s.onclick) el.onclick = () => { s.onclick(); render(); };
    stage.append(el);
  });
  stage.insertAdjacentHTML("beforeend", `<div class="center" style="${box(19, y0 + 1, 2, 2, 0)}">${centerHtml}</div>`);
}

function armPanel() {
  const smart = S.panel === "smart";
  const outs = DIRS.filter(d => d !== S.input);   // las tres salidas, siempre en el orden ↑ → ↓ ← (sin la de la entrada)
  stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${A}menu/mode_editing.png" style="left:900px;top:0">`);
  stage.insertAdjacentHTML("beforeend", `<div class="txt" style="left:900px;top:${T(11) + 18}px">${smart ? "BRAZO INTELIGENTE" : "BRAZO"}</div>`);
  // de dónde agarra: el brazo (2x2) y una ficha roja (2x2), como se ve en el tablero
  stage.insertAdjacentHTML("beforeend", `<div class="center" style="${box(18, 9, 2, 2, 0)}"><img class="big" src="${A}machines/${smart ? "SmartRoboticArm" : "AutomaticArm"}/${S.input}_game.png"></div>
    <div class="tile in" style="${box(20, 9, 2, 2, 3)}"><span class="lbl">AGARRA DE</span><span class="arr" style="font-size:28px">${ARROW[S.input]}</span><span class="lbl" style="font-weight:700">${NAME[S.input].toLowerCase()}</span></div>`);
  if (smart) return manyGrid(outs, S.many ? MANY : KINDS, S.many ? manyRoutes : S.routes);
  // brazo común: las cuatro direcciones en una fila (x 18 a 21, en el orden ↑ → ↓ ←); la de donde agarra, en rojo
  stage.insertAdjacentHTML("beforeend", `<div class="txt" style="left:900px;top:${T(8) + 16}px">DEJA TODO HACIA</div>`);
  DIRS.forEach((d, n) => {
    const el = document.createElement("div");
    el.style.cssText = box(18 + n, 7, 1, 1, 2);
    if (d === S.input) {
      el.className = "tile in";
      el.innerHTML = `<span class="arr">${ARROW[d]}</span>`;
    } else {
      el.className = `tile ${S.output === d ? "sel" : ""}`;
      el.innerHTML = `<span class="arr">${ARROW[d]}</span>`;
      el.onclick = () => { S.output = d; render(); };
    }
    stage.append(el);
  });
  boardPreview(smart, outs);
}

// Con muchos ingredientes: una celda por ingrediente, de a 4 por fila (28 entran en 7 filas). Cada clic lo manda
// al lado siguiente (nada → la primera flecha → la segunda → la tercera → nada) y una flechita en la esquina
// dice hacia dónde sale. Así cada ingrediente usa su propia imagen y sólo hacen falta 3 flechitas.
function manyGrid(outs, list, routes) {
  stage.insertAdjacentHTML("beforeend", `<div class="txt" style="left:900px;top:${T(8) + 16}px">CLIC: CAMBIA HACIA DÓNDE</div>`);
  list.forEach(([k, label, img], i) => {
    const x = 18 + (i % 4), y = 7 - Math.floor(i / 4);
    const side = routes[k] || null;
    const el = document.createElement("div");
    el.className = `tile ${side ? "sel" : ""}`;
    el.style.cssText = box(x, y, 1, 1, 2);
    el.title = label;
    el.innerHTML = `<img class="ing" src="${A}${img}">${side ? `<span class="chip key" style="right:1px;bottom:1px;background:#3b2412">${ARROW[side]}</span>` : ""}`;
    el.onclick = () => {
      const order = [null, ...outs];
      routes[k] = order[(order.indexOf(side) + 1) % order.length];
      render();
    };
    stage.append(el);
  });
  boardPreview(true, outs);
}

// En el tablero, alrededor del brazo, qué sale por cada lado (visuales que se ven sólo mientras se edita)
function boardPreview(smart, outs) {
  const cells = { up: [11, 6], down: [11, 4], right: [12, 5], left: [10, 5] };
  outs.forEach(d => {
    const [x, y] = cells[d];
    const its = smart ? (S.many ? MANY.filter(([k]) => manyRoutes[k] === d) : KINDS.filter(([k]) => S.routes[k] === d)) : (S.output === d ? [["all", "Todo", null]] : []);
    if (!its.length) return;
    const icons = its.slice(0, 2).map(([, , img]) => img ? `<img src="${badge(img)}" style="width:22px;height:22px">` : "").join("");
    stage.insertAdjacentHTML("beforeend", `<div class="abs preview" style="left:${L(x) + 2}px;top:${T(y) + 2}px">${ARROW[d]}${icons}${its.length > 2 ? "+" : ""}</div>`);
  });
}

function placePanel() {
  const machines = [["Belt", "Cinta"], ["CuttingMachine", "Cortadora"], ["Fryer", "Freidora"], ["SmartRoboticArm", "Brazo intel."]];
  stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${A}menu/mode_placing.png" style="left:900px;top:0">`);
  machines.forEach(([folder], i) => {
    const x = 18 + (i % 2) * 2, y = 10 - Math.floor(i / 2) * 2;
    const im = document.createElement("img");
    im.className = "slotimg"; im.src = `${A}machines/${folder}/${S.placeDir}_menu.png`; im.style.cssText = `left:${L(x)}px;top:${T(y, 2)}px`;
    im.onclick = () => { S.machine = i; render(); };
    stage.append(im);
    if (i === S.machine) stage.insertAdjacentHTML("beforeend", `<img class="slotsel" src="${A}menu/slot_selected.png" style="left:${L(x)}px;top:${T(y, 2)}px">`);
  });
  stage.insertAdjacentHTML("beforeend", `<div class="txt white" style="left:900px;top:${T(7) + 6}px;font-size:11.5px;text-align:left;padding-left:8px;line-height:1.55">Clic: elegir máquina<br><span class="chip">Q</span> <span class="chip">E</span> cambiar de máquina</div>`);
  stage.insertAdjacentHTML("beforeend", `<div class="txt" style="left:900px;top:${T(6) + 16}px">HACIA DÓNDE MIRA</div>`);
  const sides = {};
  DIRS.forEach(d => {
    sides[d] = {
      cls: S.placeDir === d ? "sel" : "",
      html: `<span class="arr">${ARROW[d]}</span><span class="chip key">${KEY[d]}</span>`,
      onclick: () => { S.placeDir = d; },
    };
  });
  compass(2, sides, `<img class="menu" src="${A}machines/${machines[S.machine][0]}/${S.placeDir}_menu.png">`);
}

function renderArm() {
  stage.innerHTML = "";
  scene();
  if (S.panel === "place") placePanel(); else armPanel();
  if (S.grid) stage.insertAdjacentHTML("beforeend", `<div class="grid"></div>`);
  const st = S.panel === "place" ? `colocando · mira ${S.placeDir}`
    : S.panel === "auto" ? `brazo común · agarra ${S.input} · deja todo ${S.output}`
    : `brazo intel. · agarra ${S.input} · ` + outputs().map(d => `${ARROW[d]} ${itemsFor(d).map(x => x[1]).join("+") || "nada"}`).join(" · ");
  document.getElementById("state").textContent = st;
}

// ---------------- nivel completo: la comanda ----------------
function renderWin() {
  const last = params.get("last") === "1";
  stage.innerHTML = "";
  S.panel = "place";
  scene();
  stage.insertAdjacentHTML("beforeend", `<img class="abs" src="${A}menu/mode_placing.png" style="left:900px;top:0">`);
  stage.insertAdjacentHTML("beforeend", `<div class="dim"></div>`);
  const buttons = last
    ? `<button class="btn">↺ JUGAR DE NUEVO <span class="chip">0</span></button><button class="btn alt">☰ MENÚ <span class="chip">M</span></button>`
    : `<button class="btn">SIGUIENTE NIVEL ▸ <span class="chip">N</span></button><button class="btn blue">↺ REPETIR <span class="chip">0</span></button><button class="btn alt">☰ MENÚ <span class="chip">M</span></button>`;
  stage.insertAdjacentHTML("beforeend", `<div class="ticket">
    <h3>COMANDA #1</h3><div class="meta">Buffet Albert Einstein · Tutorial 1</div>
    <div class="line"><span><img src="${A}food/Ingredients/potatoes/potato_cooked.png">Papas fritas</span><span>x2 ✓</span></div>
    <div class="line"><span>Tiempo de cocina</span><span>0:38</span></div>
    <div class="line"><span>Energía usada</span><span>7 / 10</span></div>
    <div class="line"><span>Máquinas</span><span>4</span></div>
    <div class="line total"><span>${last ? "¡FIN DEL JUEGO!" : "PEDIDO COMPLETO"}</span><span>✓</span></div>
    <div class="stamp">ENTREGADO</div>
    <div class="btnrow">${buttons}</div></div>`);
  stage.insertAdjacentHTML("beforeend", `<img class="chef" src="${A}tutorial/chef_happy_up_left.png" style="left:770px;top:330px;width:150px;height:200px">`);
  document.getElementById("state").textContent = last ? "último nivel" : "hay siguiente nivel · los números son de ejemplo";
}

function render() { bar(); if (SCREEN === "arm") renderArm(); else renderWin(); }
render();
</script>
</body>
</html>
