name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: uqbar-project/wollok-web-tools@main

      # wollok-web-tools toma el nombre del programa de la ruta del .wpgm ("src/main"), pero Wollok
      # nombra los paquetes con puntos ("src.main"). Como el juego está dentro de src/, se corrige acá.
      - name: Arreglar el nombre del programa principal
        run: sed -i "s|\.slice(0, -5)|.slice(0, -5).split('/').join('.')|" game-runner.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        uses: actions/deploy-pages@v4
